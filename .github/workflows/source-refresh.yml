name: Source refresh review
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
concurrency:
  group: source-refresh-review
  cancel-in-progress: false
jobs:
  acquire-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Stage source updates without applying them
        run: npm run source:stage -- --output work/source-refresh/scheduled
      - name: Retain metadata-only review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-review-metadata
          path: work/source-refresh/scheduled/report.json
          if-no-files-found: error
          retention-days: 14
      # Raw snapshots, excerpts, corpus.json, local diffs, builds, and credentials
      # never enter the public artifact. No commit, apply, or deploy step runs here.
