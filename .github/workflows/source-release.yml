name: Source alpha build and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # A missing manifest is a failed release check, never a successful skip.
      - run: npm run release:verify
      - run: npm run security:scan
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:source
      - run: npx playwright install --with-deps chromium
      - run: npm run test:source:browser
      - run: npm run build:standalone -- --name tampabaybot-source-alpha --outdir work/standalone/ci-alpha
      - run: npm run test:standalone -- --directory work/standalone/ci-alpha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-alpha-verification
          path: |
            evaluation/security/release-secret-scan.json
            work/standalone/ci-alpha/verification.json
            work/standalone/ci-alpha/artifact.json
            work/source-browser-report/
