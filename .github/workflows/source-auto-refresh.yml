name: Automatic source publication
on:
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: read
concurrency:
  group: source-auto-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ (vars.TAMPABAYBOT_AUTO_REFRESH_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_WORKER: ${{ vars.TAMPABAYBOT_AUTO_REFRESH_WORKER }}
      SOURCE_STATE_REPOSITORY: ${{ vars.TAMPABAYBOT_SOURCE_STATE_REPOSITORY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require publishing credentials before any acquisition
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
          SOURCE_STATE_SSH_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_SSH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND: ${{ vars.TAMPABAYBOT_SOURCE_DEPLOY_ARGV }}
        run: node -e 'for (const name of ["SOURCE_STATE_KEY","SOURCE_STATE_SSH_KEY","SOURCE_STATE_REPOSITORY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","SOURCE_WORKER","DEPLOY_COMMAND"]) if (!process.env[name]) throw new Error("Missing publishing configuration " + name)'
      - run: npm ci --ignore-scripts
      - run: node --test .github/scripts/automatic-refresh-workflow.test.mjs
      - name: Check out the private encrypted baseline
        env:
          SOURCE_STATE_SSH_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_SSH_KEY }}
        run: node scripts/private-source-vault.mjs checkout
      - name: Authenticate and restore source state
        id: restore
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs restore --input work/source-state/input/source-state.enc
      - name: Acquire, qualify and validate eligible updates
        run: npm run source:auto -- --apply --prepare-deploy --worker-name "$SOURCE_WORKER"
      - name: Encrypt the pre-deployment checkpoint
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs save --output work/source-state/checkpoint/source-state.enc
      - name: Persist the checkpoint before deploying
        id: checkpoint
        run: node scripts/private-source-vault.mjs push --phase checkpoint
      - name: Publish the checkpointed artifact
        if: ${{ steps.checkpoint.outcome == 'success' }}
        env:
          TAMPABAYBOT_SOURCE_DEPLOY_ARGV: ${{ vars.TAMPABAYBOT_SOURCE_DEPLOY_ARGV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run source:auto -- --resume-deployment --worker-name "$SOURCE_WORKER"
      - name: Encrypt completed or pending state
        id: final
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs save --output work/source-state/final/source-state.enc
      - name: Persist the final encrypted state
        if: ${{ always() && steps.final.outcome == 'success' }}
        run: node scripts/private-source-vault.mjs push --phase final
      - name: Summarize decisions
        if: always()
        run: node scripts/automatic-refresh-summary.mjs >> "$GITHUB_STEP_SUMMARY"
