name: Automatic source publication
on:
  workflow_dispatch:
    inputs:
      seed_release:
        description: 'Optional release tag containing an encrypted reviewed source-state.enc baseline'
        required: false
        type: string
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: source-auto-publication
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.TAMPABAYBOT_AUTO_REFRESH_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_WORKER: ${{ vars.TAMPABAYBOT_AUTO_REFRESH_WORKER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require publishing credentials before any acquisition
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND: ${{ vars.TAMPABAYBOT_SOURCE_DEPLOY_ARGV }}
        run: node -e 'for (const name of ["SOURCE_STATE_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","SOURCE_WORKER","DEPLOY_COMMAND"]) if (!process.env[name]) throw new Error("Missing publishing configuration " + name)'
      - run: npm ci --ignore-scripts
      - run: node --test .github/scripts/automatic-refresh-workflow.test.mjs
      - name: Locate the latest encrypted checkpoint
        id: previous
        if: ${{ inputs.seed_release == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/automatic-source-state.mjs find
      - uses: actions/download-artifact@v4
        if: ${{ inputs.seed_release == '' }}
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: work/source-state/input
      - name: Download an explicit encrypted seed baseline
        if: ${{ inputs.seed_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RELEASE: ${{ inputs.seed_release }}
        run: gh release download "$SEED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern source-state.enc --dir work/source-state/input
      - name: Authenticate and restore source state
        id: restore
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs restore --input work/source-state/input/source-state.enc
      - name: Acquire, qualify and validate eligible updates
        run: npm run source:auto -- --apply --prepare-deploy --worker-name "$SOURCE_WORKER"
      - name: Encrypt the pre-deployment checkpoint
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs save --output work/source-state/checkpoint/source-state.enc
      - name: Persist the checkpoint before deploying
        id: checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: tampabaybot-source-state-checkpoint
          path: work/source-state/checkpoint/source-state.enc
          if-no-files-found: error
          retention-days: 90
      - name: Publish the checkpointed artifact
        if: ${{ steps.checkpoint.outcome == 'success' }}
        env:
          TAMPABAYBOT_SOURCE_DEPLOY_ARGV: ${{ vars.TAMPABAYBOT_SOURCE_DEPLOY_ARGV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run source:auto -- --resume-deployment --worker-name "$SOURCE_WORKER"
      - name: Encrypt completed or pending state
        id: final
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          SOURCE_STATE_KEY: ${{ secrets.TAMPABAYBOT_SOURCE_STATE_KEY }}
        run: node scripts/automatic-source-state.mjs save --output work/source-state/final/source-state.enc
      - name: Persist the final encrypted state
        if: ${{ always() && steps.final.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tampabaybot-source-state-final
          path: work/source-state/final/source-state.enc
          if-no-files-found: error
          retention-days: 90
      - name: Summarize decisions
        if: always()
        run: node scripts/automatic-refresh-summary.mjs >> "$GITHUB_STEP_SUMMARY"
