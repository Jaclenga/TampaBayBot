name: Accessibility and Spanish regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:translations
      - run: npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:accessibility:browser
      - run: npm run test:pages:browser
      - run: VITE_DIRECTORY_ONLY=true npm run build:pages
      - run: npx playwright test --config pages-demo/playwright.preview.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-language-results
          path: |
            evaluation/accessibility/playwright-results.json
            playwright-report/
            test-results/
